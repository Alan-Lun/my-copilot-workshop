<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <header class="title-row">
      <h1 class="title">待辦清單</h1>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false"></button>
    </header>

    <!-- 新增待辦事項的輸入區域 -->
    <form id="todo-form" class="input-row">
      <input
        type="text"
        id="todo-input"
        placeholder="輸入待辦事項..."
        autocomplete="off"
      />
      <button type="submit" id="add-btn">新增</button>
    </form>

    <!-- 篩選待辦事項的按鈕 -->
    <div class="filter-row" aria-label="待辦事項篩選">
      <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">未完成</button>
      <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <!-- 待辦事項清單 -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- 清單為空時顯示的提示文字 -->
    <p id="empty-hint" class="empty-hint">還沒有任何待辦事項，新增一個吧！</p>

    <!-- 底部顯示未完成項目數量 -->
    <footer class="footer">
      <span id="remaining-count">未完成：0 項</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
